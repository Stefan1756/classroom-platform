<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-wrapper">

        <div class="auth-card">

            <div class="logo-area">
                <img src="logo.png" class="app-logo">

                <h2>Create Account</h2>

                <p>
                    Join the future of smart learning
                </p>
            </div>

            <div id="messageBox" 
                class="message hidden"></div>
            
            <div class="input-box">
                <input type="text"
                        id="username"
                        required />
                <label>Username</label>
            </div>

            <div class="input-box">
                <input type="email"
                        id="email"
                        required />
                <label>Email Address</label>
            </div>

            <div class="input-box password-box">
                <input type="password"
                        id="password"
                        required />
                <label>Password</label>

                <span class="material-icons password-toggle"
                    id="togglePassword">
                    visibility_off
                </span>
            </div>

            <div class="role-select">

                <p class="role-title">
                    Select Account Type
                </p>

                <div class="role-options">

                    <label class="role-card active">
                        <input type="radio"
                            name="role"
                            value="student"
                            checked />

                        <span class="material-icons">
                            school
                        </span>

                        <h4>Student</h4>

                        <small>Join classes & learn</small>
                    </label>

                    <label class="role-card">
                        <input type="radio"
                            name="role"
                            value="teacher" />

                        <span class="material-icons">
                            menu_book
                        </span>

                        <h4>Teacher</h4>

                        <small>Create & manage classes</small>
                    </label>
 
                </div>
            </div>

            <div class="terms-box">
                <input type="checkbox" id="termsCheck">

                <p>
                    I agree to the
                    <span>Terms & Conditions</span>
                    and
                   <span>Privacy Policy</span>
                </p>
            </div>

            <button id="signupBtn">
                Create Account
            </button>

            <div class="link">
                <a href="index.html">
                    Already have an account? Login
                </a>
            </div>
        </div>
    </div>

    <script type="module" src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
    <script type="module" src="signup.js"></script>
</body>
</html>
