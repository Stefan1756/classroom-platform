<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuityHub - Smart Learning & Student Management System</title>
    <meta name="description" content="TuityHub is a smart learning platform for students and teachers. Manage classes, tasks, Subscriptions, and track learning progress efficiently.">
    <meta name="keywords" content="TuityHub, e-learning, student dashboard, online classes, education platform, learning management system, LMS Tanzania">
    <meta name="author" content="TuityHub">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="TuityHub - Smart Learning Platform">
    <meta property="og:description" content="Manage classes, tasks, subscriptions and learning progress in one powerful system.">
    <meta property="og:image" content="logo.png">
    <meta property="og:url" content="https://tuityhub.netlify.app">
    <meta property="og:type" content="website">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "TuityHub",
        "url": "https://tuityhub.netlify.app",
        "logo": "https://yourdomain.com/assets/icons/logo.png",
        "description": "Smart learning platform for students and teachers."
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-wrapper">

        <div class="auth-card">

            <div class="logo-area">
                <img src="logo.png" class="app-logo">

                <h2>Sign In</h2>

                <p>
                    Welcome back to tuityhub smart learning system
                </p>
            </div>

        <div id="messageBox" class="message hidden"></div>
        <div class="input-box">
                <input type="email"
                        id="email"
                        required />
                <label>Email Address</label>
            </div>
        
        <div class="input-box password-box">
                <input type="password"
                        id="password"
                        required />
                <label>Password</label>

                <span class="material-icons password-toggle"
                    id="togglePassword">
                    visibility_off
                </span>
            </div>
        <button id="loginBtn">Login</button>

        <div class="forgot-link">
    <a href="#" id="forgotPasswordBtn">
        Forgot Password?
    </a>
</div>

        <div class="link">
            <a href="signup.html">Don't have an account? Sign Up</a>
        </div>
    </div>

    <script type="module" src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
    <script type="module" src="login.js"></script>
</body>
</html>
