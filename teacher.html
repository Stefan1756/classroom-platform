<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link rel="manifest" href="public/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="teacher.css">
</head>
<body>

    <main class="content" id="contentArea"></main>

    <nav class="bottom-nav">
        <div class="nav-item" data-page="classes">
            <span class="material-icons">school</span>
            <span class="label">Classes</span>
        </div>

        <div class="nav-item" data-page="dashboard">
            <span class="material-icons">home</span>
            <span class="label">Home</span>
        </div>

        <div class="nav-item active" data-page="subscription">
            <span class="material-icons">account_balance_wallet</span>
            <span class="label">Wallet</span>
        </div>

        <div class="nav-item" data-page="profile">
            <span class="material-icons">person</span>
            <span class="label">Profile</span>
        </div>
    </nav>
    
    <script type="module" src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"></script>
    <script type="module" src="teacher.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker
                    .register("public/sw.js")
                    .then(() => {
                        console.log("PWA Ready");
                        
                    })
            })
        }
    </script>
</body>
</html>
