<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="manifest" href="public/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <main class="content" id="contentArea"></main>

    <nav class="bottom-nav">

        <div class="nav-item" data-page="users">
            <span class="material-icons">group</span>
            <span class="label">Users</span>
        </div>

        <div class="nav-item active" data-page="dashboard">
            <span class="material-icons">dashboard</span>
            <span class="label">Home</span>
        </div>

        <div class="nav-item" data-page="subscriptions">
            <span class="material-icons">verified</span>
            <span class="label">Subscriptions</span>
        </div>

        <div class="nav-item" data-page="payments">
            <span class="material-icons">swap_horiz</span>
            <span class="label">Payments</span>
        </div>
    </nav>

    <div class="user-modal" id="userModal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">X</span>

            <div class="user-header">
                <div class="avatar" id="userAvatar"></div>
                <h3 id="modalUsername"></h3>
                <p id="modalEmail"></p>
            </div>

            <div class="user-details">
                <p><strong>Role:</strong> <span id="modalRole"></span></p>
                <p><strong>Status:</strong> <span id="modalStatus"></span></p>
            </div>

            <div class="modal-actions" id="modalActions">
                
            </div>
        </div>
    </div>

    <div class="user-modal" id="adminModal">
        <div class="modal-content">
            <span id="closeAdminModal">X</span>

            <h3>Admin Profile</h3>
            <p id="adminEmail"></p>
            <p id="adminJoinDate"></p>
        </div>
    </div>

    <script type="module" src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
    <script type="module" src="admin-users.js"></script>
    <script type="module" src="admin.js"></script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker
                    .register("public/sw.js")
                    .then(() => {
                        console.log("PWA Ready");
                        
                    })
            })
        }
    </script>
    
</body>
</html>
