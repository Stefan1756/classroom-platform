    </header>

    <div class="notification-panel" id="notificationPanel">
        <div class="panel-content">
            <h4>Notifications</h4>
            <div id="notificationList"></div>
        </div>
    </div>

    <main class="content" id="contentArea"></main>

    <nav class="bottom-nav">

        <div class="nav-item" data-page="users">
            <span class="material-icons">group</span>
            <p>Users</p>
        </div>

        <div class="nav-item center" data-page="dashboard">
            <span class="material-icons">dashboard</span>
        </div>

        <div class="nav-item" data-page="settings">
            <span class="material-icons">settings</span>
            <p>Settings</p>
        </div>
    </nav>

    <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-content">
            <div class="drag-bar"></div>
            <p>Add Profile Picture</p>
            <p id="logoutBtn">Sign Out</p>
        </div>
    </div>

    <div class="user-modal" id="userModal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">X</span>

            <div class="user-header">
                <div class="avatar" id="userAvatar"></div>
                <h3 id="modalUsername"></h3>
                <p id="modalEmail"></p>
            </div>

            <div class="user-details">
                <p><strong>Role:</strong> <span id="modalRole"></span></p>
                <p><strong>Status:</strong> <span id="modalStatus"></span></p>
            </div>

            <div class="modal-actions" id="modalActions">
                
            </div>
        </div>
    </div>

    <div class="user-modal" id="adminModal">
        <div class="modal-content">
            <span id="closeAdminModal">X</span>

            <h3>Admin Profile</h3>
            <p id="adminEmail"></p>
            <p id="adminJoinDate"></p>
        </div>
    </div>

    <script type="module" src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
    <script type="module" src="admin-users.js"></script>
    <script type="module" src="admin.js"></script>
    
</body>
</html>
